name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Run all tests (real Chromium with the extension loaded)
        run: |
          export BROWSER_PATH="$(node -p "require('playwright-core').chromium.executablePath()")"
          xvfb-run -a npm test
