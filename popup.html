<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lightweight Ad Blocker Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070913;
      --card-bg: rgba(18, 24, 43, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-red: #ff0055;
      --primary-glow: rgba(255, 0, 85, 0.35);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      padding: 16px;
      font-family: 'Outfit', -apple-system, sans-serif;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(255, 0, 85, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(0, 242, 254, 0.12) 0%, transparent 40%);
      color: var(--text-main);
      overflow: hidden;
    }

    /* Header Bar */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      box-shadow: 0 0 16px var(--primary-glow);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .brand-icon:hover {
      transform: scale(1.1) rotate(5deg);
    }

    .brand-text h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .status-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      color: var(--success);
      letter-spacing: 0.5px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
      animation: pulse-green 1.8s infinite;
    }

    @keyframes pulse-green {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.6; }
    }

    /* Hero Card with Rotating Conic Glow Animation */
    .hero-card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px 16px;
      text-align: center;
      margin-bottom: 14px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: conic-gradient(from 0deg, transparent 0%, rgba(0, 242, 254, 0.12) 25%, transparent 50%, rgba(255, 0, 85, 0.18) 75%, transparent 100%);
      animation: rotate-bg 8s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes rotate-bg {
      100% { transform: rotate(360deg); }
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero-number {
      font-size: 40px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #00f2fe 0%, #ff0055 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.3));
    }

    .hero-label {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    /* 2x2 Stats Grid with Cyber Hover Glow */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-box {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .stat-box:hover {
      transform: translateY(-3px);
      border-color: rgba(0, 242, 254, 0.35);
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.2);
    }

    .stat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .stat-svg {
      width: 18px;
      height: 18px;
      color: var(--accent-cyan);
      filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.4));
    }

    .stat-val {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
    }

    .stat-lbl {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* Toggles Card */
    .toggles-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 6px 14px;
      margin-bottom: 14px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .toggle-row:last-child {
      border-bottom: none;
    }

    .toggle-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toggle-svg {
      width: 16px;
      height: 16px;
      color: var(--primary-red);
      filter: drop-shadow(0 0 6px var(--primary-glow));
    }

    .toggle-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Cyber Switch with Bouncy Animated Slider */
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: 0.3s ease;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #f8fafc;
      transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-radius: 50%;
    }

    input:checked + .slider {
      background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--primary-red) 100%);
      box-shadow: 0 0 12px var(--primary-glow);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    /* Action / Reset Button */
    .action-btn {
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.25s ease;
    }

    .action-btn:hover {
      background: rgba(255, 0, 85, 0.12);
      border-color: var(--primary-red);
      color: #ff0055;
      box-shadow: 0 0 16px rgba(255, 0, 85, 0.2);
    }

    .action-btn svg {
      width: 14px;
      height: 14px;
      transition: transform 0.4s ease;
    }

    .action-btn:hover svg {
      transform: rotate(180deg);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header-bar">
    <div class="brand">
      <img src="icons/icon48.png" class="brand-icon" alt="Ad Blocker Logo">
      <div class="brand-text">
        <h1>Ad Blocker Pro</h1>
        <div class="brand-subtitle">Lightweight & Focused</div>
      </div>
    </div>
    <div class="status-tag">
      <span class="status-dot"></span>
      PROTECTED
    </div>
  </div>

  <!-- Hero Card with Rotating Conic Glow Ring -->
  <div class="hero-card">
    <div class="hero-content">
      <div class="hero-number" id="totalBlocked">0</div>
      <div class="hero-label">Total Threats Blocked</div>
    </div>
  </div>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-header">
        <svg class="stat-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
      </div>
      <div class="stat-val" id="adsBlocked">0</div>
      <div class="stat-lbl">Ads & Banners</div>
    </div>

    <div class="stat-box">
      <div class="stat-header">
        <svg class="stat-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
        </svg>
      </div>
      <div class="stat-val" id="popupsBlocked">0</div>
      <div class="stat-lbl">Popunders & Popups</div>
    </div>

    <div class="stat-box">
      <div class="stat-header">
        <svg class="stat-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <div class="stat-val" id="ytAdsSkipped">0</div>
      <div class="stat-lbl">YouTube Auto-Skip</div>
    </div>

    <div class="stat-box">
      <div class="stat-header">
        <svg class="stat-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </div>
      <div class="stat-val" id="fbSponsoredRemoved">0</div>
      <div class="stat-lbl">FB Sponsored</div>
    </div>
  </div>

  <!-- Toggles Card -->
  <div class="toggles-card">
    <div class="toggle-row">
      <div class="toggle-info">
        <svg class="toggle-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
        </svg>
        <span class="toggle-text">Popunder & Click Shield</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="togglePopups" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <div class="toggle-info">
        <svg class="toggle-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="toggle-text">YouTube Video Auto-Skip</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleYT" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <div class="toggle-info">
        <svg class="toggle-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
        </svg>
        <span class="toggle-text">Facebook Sponsored Cleaner</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleFB" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Action Bar -->
  <button class="action-btn" id="resetStats">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
    </svg>
    Reset Threat Counters
  </button>

  <script src="popup.js"></script>
</body>
</html>
