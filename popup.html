<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
  :root{--bg:#fff;--fg:#1b1b1f;--mut:#6b6b76;--ac:#2563eb;--ok:#16a34a;--warn:#d97706;--ln:#e5e5ea}
  @media (prefers-color-scheme:dark){:root{--bg:#17171c;--fg:#ececf1;--mut:#9a9aa6;--ln:#2d2d36}}
  body{margin:0;width:300px;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
  main{padding:16px}
  h1{font-size:15px;margin:0 0 2px}
  .host{color:var(--mut);font-size:12px;word-break:break-all;margin-bottom:14px}
  .state{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:600}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}
  .off .dot{background:var(--warn)}
  button{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;background:none;color:var(--fg);font:inherit;cursor:pointer}
  button:hover{border-color:var(--ac)}
  h2{font-size:12px;color:var(--mut);margin:16px 0 6px;font-weight:600}
  ul{margin:0;padding:0;list-style:none;font-size:12px;color:var(--mut)}
  li{padding:3px 0;word-break:break-all;border-top:1px solid var(--ln)}
  .mut{color:var(--mut);font-size:12px;margin-top:6px}
  li{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .dom{word-break:break-all}
  button.sm{width:auto;padding:2px 8px;font-size:12px;flex:none}
</style></head>
<body><main id="m">
  <h1>LiteBlock</h1>
  <div class="host" id="host"></div>
  <div class="state"><span class="dot"></span><span id="state"></span></div>
  <button id="toggle"></button>
  <button id="zap" style="margin-top:8px">Zap an element</button>
  <label class="mut" style="display:flex;align-items:center;gap:6px;margin-top:10px"><input type="checkbox" id="toast"> Show notice when a popup is blocked</label>
  <button id="diag" style="margin-top:8px">Site broken? Diagnose</button>
  <div id="log"></div>
</main><script src="popup.js"></script></body></html>
